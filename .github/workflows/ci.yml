name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: translatebook
          POSTGRES_PASSWORD: translatebook
          POSTGRES_DB: translatebook_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U translatebook -d translatebook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LLM_PROVIDER: fake
      WORKER_INLINE: "false"
      DATABASE_URL: postgresql+asyncpg://translatebook:translatebook@localhost:5433/translatebook_test
      TEST_DATABASE_URL: postgresql+asyncpg://translatebook:translatebook@localhost:5433/translatebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv --directory backend sync --frozen
      - name: Lint
        run: |
          uv --directory backend run ruff check app tests
          uv --directory backend run ruff format --check app tests
      - name: Test
        run: uv --directory backend run pytest -q --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
