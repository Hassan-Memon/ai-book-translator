services:
  db:
    image: pgvector/pgvector:pg17
    container_name: translatebook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: translatebook
      POSTGRES_PASSWORD: translatebook
      POSTGRES_DB: translatebook_v2
    ports:
      # Host 5433 on purpose: a locally installed PostgreSQL commonly already
      # owns 5432, and on Windows both can bind it while connections silently
      # land on the wrong server. Override with DB_PORT if 5433 is taken too.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the translatebook_test database that `pytest` uses.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translatebook -d translatebook_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full stack (API + worker + static UI): `docker compose --profile full up --build`.
  api:
    build: .
    image: translatebook-ai
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://translatebook:translatebook@db:5432/translatebook_v2
      WORKER_INLINE: "false"
    ports:
      - "8010:8010"
    volumes:
      - appdata:/app/backend/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: translatebook-ai
    profiles: ["full"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://translatebook:translatebook@db:5432/translatebook_v2
    command: ["python", "-m", "app.worker"]
    volumes:
      - appdata:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
  appdata:
