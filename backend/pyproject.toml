[project]
name = "translatebook-ai"
version = "0.1.0"
description = "Structure-aware, context-preserving AI book translation pipeline (Urdu <-> Arabic)"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # ai pipeline
    "langgraph>=0.3",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.3",
    # pdf / documents
    "pymupdf>=1.25",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "python-docx>=1.1",
    # cli
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
# Local offline OCR. Heavy (~2.5GB via torch) and its wheel set lags new CPython
# releases, so it is opt-in: `uv sync --extra ocr-local`. Without it the OCR
# ladder in app/pipeline/ocr.py falls straight through to vision-LLM OCR.
ocr-local = [
    "easyocr>=1.7.2",
]
anthropic = [
    "langchain-anthropic>=0.3",
]
ollama = [
    "langchain-ollama>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
translatebook = "app.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
