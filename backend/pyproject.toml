[project]
name = "translatebook-ai"
version = "0.2.0"
description = "Structure-aware, context-preserving AI book translation pipeline (Urdu <-> Arabic)"
requires-python = ">=3.12,<3.14"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # ai pipeline
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "tenacity>=9.0",
    # pdf / documents
    "pymupdf>=1.25",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "python-docx>=1.1",
    # cli
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.7",
]

[project.optional-dependencies]
# Local offline OCR. Heavy (~2.5GB via torch) and its wheel set lags new CPython
# releases, so it is opt-in: `uv sync --extra ocr-local`. Without it the OCR
# ladder in app/pipeline/extractor.py falls straight through to vision-LLM OCR.
ocr-local = [
    "easyocr>=1.7.2",
]
anthropic = [
    "langchain-anthropic>=0.3",
]
ollama = [
    "langchain-ollama>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
translatebook = "app.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db_init.py", "app/test_llm.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
