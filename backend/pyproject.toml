[project]
name = "translatebook-ai"
version = "0.4.0"
description = "Translate whole books between any two languages with free OCR, any LLM (cloud or local) and a human in the loop"
requires-python = ">=3.12,<3.14"
dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "greenlet>=3.1",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # ai pipeline
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "tenacity>=9.0",
    # pdf / documents
    "pymupdf>=1.25",
    "reportlab>=4.2",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "python-docx>=1.1",
    # cli
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.7",
    "pytesseract>=0.3.13",
    "numpy>=2.0",
    "cryptography>=43",
    "langchain-ollama>=0.3",
    "langchain-anthropic>=0.3",
]

[project.optional-dependencies]
# Neural OCR fallback. Heavy (~2.5GB via torch), so it is opt-in:
# `uv sync --extra ocr-neural`. The default ladder (app/pipeline/ocr/) needs
# nothing beyond the core install: Tesseract via PyMuPDF + auto-downloaded
# language packs.
ocr-neural = [
    "easyocr>=1.7.2",
]
# Kept for backwards compatibility with older docs; both are core now.
anthropic = []
ollama = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
translatebook = "app.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine runs ORM code inside greenlets; without this,
# coverage misses most route and service lines executed after an await.
concurrency = ["greenlet", "thread"]
omit = ["app/db_init.py", "app/test_llm.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults
